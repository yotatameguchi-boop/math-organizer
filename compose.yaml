services:
  server:
    build: .
    image: math-organizer
    container_name: math-organizer
    restart: unless-stopped
    ports:
      - "${PORT:-5174}:5174"
    environment:
      # 未指定なら data/token に自動生成される。固定したいときだけ .env に書く。
      MO_TOKEN: ${MO_TOKEN:-}
      # ブラウザから叩くオリジン。vite dev と、コンテナ自身が配信する分。
      MO_ORIGINS: ${MO_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
    volumes:
      # DB とトークンはホスト側に残す。コンテナを作り直しても問題帳は消えない。
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5174/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
